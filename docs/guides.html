<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guides & Documentation - Programming Foundations</title>
    <link rel="stylesheet" href="styles.css?v=ux7" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div data-pf-header></div>
    <script src="config.js"></script>
    <script src="site.js?v=ux7"></script>

    <main id="main" class="container">
      <section class="hero">
        <h2>Guides & documentation</h2>
        <p>
          Stay on Programming Foundations. These first-party guides replace off-site “stretch”
          links so you can keep learning here.
        </p>
        <div class="button-row">
          <a class="btn btn-primary" href="guide-viewer.html?path=guides/prompting-guide.md"
            >Open Prompting Guide</a
          >
          <a class="btn btn-secondary" href="ai-course.html">Back to AI Course</a>
        </div>
      </section>

      <section class="section">
        <label class="guides-search-label" for="guides-search">Search guides</label>
        <input
          id="guides-search"
          class="field-input"
          type="search"
          placeholder="Try prompting, RAG, safety, evals…"
          autocomplete="off"
        />
      </section>

      <div id="guides-catalog" class="guides-catalog" aria-live="polite">
        <p class="note">Loading guides…</p>
      </div>
    </main>

    <script>
      const catalogEl = document.getElementById("guides-catalog");
      const searchEl = document.getElementById("guides-search");
      let catalog = null;

      const render = (filter) => {
        if (!catalog) return;
        const q = (filter || "").trim().toLowerCase();
        catalogEl.innerHTML = "";

        catalog.categories.forEach((category) => {
          const guides = category.guides.filter((g) => {
            if (!q) return true;
            const hay = `${g.title} ${g.blurb} ${category.title}`.toLowerCase();
            return hay.includes(q);
          });
          if (!guides.length) return;

          const section = document.createElement("section");
          section.className = "section";
          section.innerHTML = `<h3>${category.title}</h3><p>${category.description}</p>`;

          const grid = document.createElement("div");
          grid.className = "grid cols-2 guides-grid";
          guides.forEach((guide) => {
            const article = document.createElement("article");
            article.className = "help-card guide-card";
            article.innerHTML = `
              <h3>${guide.title}</h3>
              <p>${guide.blurb}</p>
              <div class="button-row">
                <a class="btn btn-primary" href="guide-viewer.html?path=guides/${encodeURIComponent(guide.slug)}.md">
                  Read guide
                </a>
              </div>
            `;
            grid.appendChild(article);
          });
          section.appendChild(grid);
          catalogEl.appendChild(section);
        });

        if (!catalogEl.children.length) {
          catalogEl.innerHTML = `<p class="note">No guides match “${filter}”. Try another word, or <a href="guides.html">clear search</a>.</p>`;
        }
      };

      fetch("guides/index.json")
        .then((r) => {
          if (!r.ok) throw new Error("Could not load guides index.");
          return r.json();
        })
        .then((data) => {
          catalog = data;
          render("");
        })
        .catch(() => {
          catalogEl.innerHTML =
            '<p class="note">Guides are temporarily unavailable. Try refreshing, or open <a href="help.html">Help</a>.</p>';
        });

      searchEl.addEventListener("input", () => render(searchEl.value));
    </script>
  </body>
</html>
