services:
  - type: web
    name: programming-foundations-api
    runtime: node
    rootDir: backend
    # Free web services cannot keep SQLite across restarts.
    # Starter + disk is the practical open-beta setup.
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_PATH
        value: /data/pf.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_API_BASE
        sync: false
      - key: FRONTEND_DEFAULT_RETURN
        sync: false
      # Optional social sign-in — set in the Render dashboard (never commit secrets).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      # Comma-separated allowlist of emails permitted to create an org / hold
      # the admin role. Set your own email in the Render dashboard — never in git.
      - key: ORG_CREATOR_EMAILS
        sync: false
    disk:
      name: pf-data
      mountPath: /data
      sizeGB: 1
