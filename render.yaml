services:
  - type: web
    name: programming-foundations-api
    runtime: node
    rootDir: backend
    # Free web services cannot keep SQLite across restarts.
    # Starter + disk is the practical open-beta setup.
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_PATH
        value: /data/pf.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: pf-data
      mountPath: /data
      sizeGB: 1
