services:
  - type: web
    name: programming-foundations-api
    runtime: node
    rootDir: backend
    # Free web services cannot keep SQLite across restarts.
    # Starter + disk is the practical open-beta setup.
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_PATH
        value: /data/pf.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      # Comma-separated allowlist of emails permitted to create an org / hold
      # the admin role. Set your own email in the Render dashboard — never in git.
      - key: ORG_CREATOR_EMAILS
        sync: false
      # Extra emails that always unlock donor/premium courses and can grant
      # donor access to other accounts. Owner emails in ORG_CREATOR_EMAILS are
      # included automatically. Set in the Render dashboard — never in git.
      - key: PREMIUM_ACCESS_EMAILS
        sync: false
    disk:
      name: pf-data
      mountPath: /data
      sizeGB: 1
